short_bio: >-
  <p>I am a <strong>Research Scientist</strong> at the London Research Center of <a href="https://www.noahlab.com.hk/" target="_blank" rel="noopener">Huawei Noah’s Ark Lab</a>, where I collaborate with <a href="https://profiles.ucl.ac.uk/10613-jun-wang" target="_blank" rel="noopener">Prof. Jun Wang</a>. I build AI methods and scientific software to understand and discover materials. My research connects <strong>scientific agents, crystal representation learning, and Bayesian optimization</strong>, with the goal of turning experimental data into physical insight and better experimental decisions.</p>
  <p>I led the development of <strong><a href="https://ganjiang.asia/" target="_blank" rel="noopener">Ganjiang (干将)</a></strong>, a self-learning scientific agent for X-ray diffraction. Ganjiang brings phase identification, multiphase decomposition, and structure refinement into a unified workflow, and turns validated analytical experience into reusable skills. This work advances my broader aim: scientific AI that reasons with physical evidence and improves through experience. <a href="https://arxiv.org/abs/2610.07862" target="_blank" rel="noopener">Read the paper</a></p>
  <p>My work spans the diffraction analysis pipeline: large-scale simulation with <a href="https://github.com/Bin-Cao/SimXRD">SimXRD</a> (ICLR 2025), phase identification with <a href="https://github.com/Asterbin/Asterbin-XMatcher">XMatcher</a> and <a href="https://github.com/Bin-Cao/XQueryer">XQueryer</a> (NSR), multiphase analysis with <a href="https://arxiv.org/abs/2605.05866">XDecomposer</a> (NeurIPS 2026), and physics-constrained refinement with <a href="https://github.com/Bin-Cao/PyWPEM">WPEM</a>. I also developed <a href="https://github.com/Bin-Cao/PRDNet">PRDNet</a> (ICLR 2026) for crystal property prediction and <a href="https://github.com/Bin-Cao/Bgolearn">Bgolearn</a> for Bayesian experimental design. Bgolearn was selected for support under the Shanghai Municipal Commission of Economy and Informatization’s Open Source Project Program.</p>
  <p>I received my Ph.D. from <a href="https://www.hkust-gz.edu.cn/">HKUST (Guangzhou)</a>, advised by <a href="https://english.casad.cas.cn/members/casm/dots/202404/t20240418_660476.html">Prof. Tong-Yi Zhang</a>, and visited <a href="https://www.cityu.edu.hk/">City University of Hong Kong</a> to work with <a href="https://scholars.cityu.edu.hk/en/persons/yangren/">Prof. Yang Ren</a>. My background combines mechanics at <a href="https://www.shu.edu.cn/">Shanghai University</a> and chemical machinery at <a href="https://www.buct.edu.cn/main.htm">Beijing University of Chemical Technology</a>, with research experience at <a href="https://www.shlab.org.cn/">Shanghai AI Lab</a>, <a href="https://www.greendynamics.com.au/">GreenDynamics</a>, <a href="https://www.yangtzeailab.com/">AI Lab, The Yangtze River Delta</a>, and <a href="https://www.zhejianglab.org/">Zhejiang Lab</a>.</p>
  <p>I review for <a href="https://iclr.cc/">ICLR</a>, <a href="https://neurips.cc/">NeurIPS</a>, <a href="https://icml.cc/">ICML</a>, <a href="https://aaai.org/">AAAI</a>, <a href="https://www.kdd.org/">KDD</a>, and journals including <a href="https://www.nature.com/commsmat/">Communications Materials</a>, <a href="https://journals.iucr.org/j/">Journal of Applied Crystallography</a>, <a href="https://www.sciencedirect.com/journal/engineering-applications-of-artificial-intelligence">EAAI</a>, <a href="https://www.sciencedirect.com/journal/results-in-engineering">Results in Engineering</a>, and <a href="https://onlinelibrary.wiley.com/journal/29409497">MGE Advances</a>. Outside research, I enjoy running and strength training.</p>

      


